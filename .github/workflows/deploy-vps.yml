# Deploy tools (repo PÚBLICO) — inline (não pode usar o reusable do Guebly/Guebly privado).
# build no runner -> GHCR -> SSH VPS -> pull+up+health+rollback. NÃO builda na VPS.
name: Deploy tools
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-tools
  cancel-in-progress: false
env:
  APP: tools
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/guebly/tools:${{ github.sha }}
            ghcr.io/guebly/tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    steps:
      - name: Configura chave SSH
        env:
          VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Deploy na VPS
        env:
          APP: tools
          SHA: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETRIES: "30"
        run: |
          cat > /tmp/gh-deploy.sh <<'REMOTE'
          set -euo pipefail
          cd "/opt/$APP"
          echo "==> Deploy $APP ($SHA)"
          PREV="$(docker inspect --format='{{.Image}}' "$APP" 2>/dev/null || echo '')"
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          export IMAGE_TAG="$SHA"
          docker compose pull
          docker compose up -d
          ok=false
          for i in $(seq 1 "$RETRIES"); do
            STATUS="$(docker inspect --format='{{.State.Health.Status}}' "$APP" 2>/dev/null || echo 'starting')"
            echo "  health $i/$RETRIES -> $STATUS"
            [ "$STATUS" = "healthy" ] && { ok=true; break; }
            sleep 2
          done
          if [ "$ok" = "true" ]; then echo "OK healthy"; exit 0; fi
          echo "==> HEALTH FALHOU — rollback"
          if [ -n "$PREV" ]; then
            docker tag "$PREV" "ghcr.io/guebly/$APP:latest"
            IMAGE_TAG=latest docker compose up -d
          fi
          exit 1
          REMOTE
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            "root@$VPS_HOST" \
            "APP='$APP' SHA='$SHA' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' RETRIES='$RETRIES' bash -s" \
            < /tmp/gh-deploy.sh
