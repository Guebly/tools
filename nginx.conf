server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    # COOP/COEP: necessário p/ SharedArrayBuffer (@huggingface/transformers)
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options nosniff always;
    location = /health { access_log off; add_header Content-Type text/plain; return 200 "ok"; }
    # nginx só herda os add_header do bloco pai se o bloco filho nao declarar
    # nenhum add_header proprio. Como este location define Cache-Control, os
    # COOP/COEP/X-Content-Type-Options do server{} acima eram descartados aqui,
    # e o whisper.worker-*.js (servido daqui) ia pro navegador sem COEP —
    # que quebra a criacao do Worker numa pagina cross-origin-isolated (COEP).
    # Precisa redeclarar tudo explicitamente:
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
